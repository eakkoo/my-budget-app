<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกค่าใช้จ่าย (ปลา & เอก)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; margin: 0; }
    .card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background-color: #a0c3ff; }
    #status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>บันทึกค่าใช้จ่าย</h2>
  <form id="expenseForm">
    <div class="form-group">
      <label>วันที่:</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label>ผู้บันทึก:</label>
      <select id="person" required>
        <option value="ปลา">ปลา</option>
        <option value="เอก">เอก</option>
      </select>
    </div>

    <div class="form-group">
      <label>หมวดหมู่:</label>
      <select id="category" required>
        <option value="อาหาร/เครื่องดื่ม">อาหาร/เครื่องดื่ม</option>
        <option value="ค่าเดินทาง">ค่าเดินทาง</option>
        <option value="สาธารณูปโภค">สาธารณูปโภค</option>
        <option value="ของใช้ในบ้าน">ของใช้ในบ้าน</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="form-group">
      <label>รายละเอียด:</label>
      <input type="text" id="description" placeholder="เช่น ค่าข้าวเย็น, แท็กซี่" required>
    </div>

    <div class="form-group">
      <label>จำนวนเงิน (บาท):</label>
      <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
    </div>

    <button type="submit" id="btnSubmit">บันทึกลง Google Sheets</button>
  </form>

  <div id="status"></div>
</div>

<script>
  // 🔴 นำ URL ที่ได้จากการ Deploy Google Apps Script มาวางตรงนี้
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxgRQhIeoivRJGhyrN5g4fUbex-88YCQQBzt_vBVEKt-YHvOZ7hCq64RjcaT0v6vpGl/exec";

  // กำหนดวันที่เริ่มต้นให้เป็นวันปัจจุบัน
  document.getElementById('date').valueAsDate = new Date();

  document.getElementById('expenseForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnSubmit');
    const statusDiv = document.getElementById('status');

    btn.disabled = true;
    btn.innerText = "กำลังบันทึกข้อมูล...";
    statusDiv.innerText = "";

    const payload = {
      date: document.getElementById('date').value,
      person: document.getElementById('person').value,
      category: document.getElementById('category').value,
      description: document.getElementById('description').value,
      amount: document.getElementById('amount').value
    };

    try {
      // ส่งข้อมูลไปยัง Google Apps Script
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors', // รองรับการส่งข้ามโดเมน
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      statusDiv.style.color = "green";
      statusDiv.innerText = "✅ บันทึกข้อมูลเรียบร้อยแล้ว!";
      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';

    } catch (error) {
      statusDiv.style.color = "red";
      statusDiv.innerText = "❌ เกิดข้อผิดพลาดในการบันทึก";
      console.error(error);
    } finally {
      btn.disabled = false;
      btn.innerText = "บันทึกลง Google Sheets";
    }
  });
</script>

</body>
</html>
